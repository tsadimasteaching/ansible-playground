all:
  vars:
    # Instruct Ansible to connect using SSH for Vagrant VMs
    ansible_connection: ssh
    ansible_user: vagrant
    # Dynamically find the SSH keys generated by Vagrant for each host
    ansible_ssh_private_key_file: vagrant/.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key
    ansible_python_interpreter: /usr/bin/python3
  children:
    appservers:
      hosts:
        app-vm:
          ansible_host: 192.168.56.10
    dbservers:
      hosts:
        db-vm:
          ansible_host: 192.168.56.11
    lbservers:
      hosts:  
        lb-vm:
          ansible_host: 192.168.56.12