---
user_dir: "{{ ansible_facts['env']['HOME'] }}"
app_dir: "{{ user_dir }}/fastapi"

git_repo_url: "https://github.com/tsadimasteaching/cloud-platforms-fastapi-vue.git"
git_repo_branch: "main"
git_clone_tmp_dir: "/tmp/repo"
git_sparse_checkout_path: "services/backend"

app_port: 8000
install_nginx: false  # set to true to install and configure nginx in fastapi.yaml
tortoise_orm_config: "src.database.config.TORTOISE_ORM"

# Vue.js frontend
vue_app_dir: "{{ user_dir }}/vue"
vue_site_location: "/var/www/vue"
vue_sparse_checkout_path: "services/frontend"
node_version: "20.12.1"
# Used by nginx proxy_pass — localhost because nginx and uvicorn run on the same machine
backend_server_url: "http://127.0.0.1:{{ app_port }}"

# Environment variables written to Vue app's .env file.
# VITE_API_URL must use the public IP — this URL is embedded in the JS bundle
# and resolved by the browser, not the server.
vueapp:
  VUE_APP_API_URL: "http://{{ app_server_host }}"

# Variables used by files/uvicorn.service.j2
service:
  workingdir: "{{ app_dir }}"
  execstart: "{{ app_dir }}/favenv/bin/uvicorn src.main:app --host 0.0.0.0 --port {{ app_port }}"

# Environment variables written to app's .env file (src/database/.env)
# db.* comes from group_vars/all.yaml which is loaded for every host.
app:
  env:
    DB_HOST: "{{ db.host }}"
    DB_PORT: "{{ db.port }}"
    DB_NAME: "{{ db.name }}"
    DB_USER: "{{ db.user }}"
    DB_PASSWORD: "{{ db.password }}"
    DATABASE_URL: "postgres://{{ db.user }}:{{ db.password }}@{{ db.host }}:{{ db.port }}/{{ db.name }}"
